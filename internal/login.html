<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTIS - Internal Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #051324;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 3rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo {
      max-width: 150px;
      margin-bottom: 2rem;
    }
    h2 {
      font-family: 'Syne', sans-serif;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
      letter-spacing: 2px;
    }
    input:focus {
      border-color: #f7941d;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #f7941d;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #eab308;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
    .error-msg.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="/imgs/otis-logo.png" alt="OTIS Logo" class="logo">
    <h2>Internal Access</h2>
    <p>Authorized access only.</p>
    
    <div class="form-group">
      <label for="pin">Executive PIN</label>
      <input type="password" id="pin" placeholder="••••••••" autocomplete="current-password" />
    </div>
    
    <button id="unlock-btn" onclick="login()">Unlock</button>
    <div id="error" class="error-msg">Access denied. Check the PIN and try again.</div>
  </div>

  <script>
    document.getElementById('pin').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const pin = document.getElementById('pin').value;
      const btn = document.getElementById('unlock-btn');
      const err = document.getElementById('error');
      
      btn.innerText = 'Verifying...';
      err.classList.remove('visible');

      try {
        const res = await fetch('/api/internal/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        
        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next');
          
          if (next && next.startsWith('/internal/')) {
            window.location.href = next;
          } else {
            window.location.href = '/internal/command-center';
          }
        } else {
          err.classList.add('visible');
          btn.innerText = 'Unlock';
          document.getElementById('pin').value = '';
        }
      } catch (e) {
        err.innerText = 'Server error. Please try again.';
        err.classList.add('visible');
        btn.innerText = 'Unlock';
      }
    }
  </script>
</body>
</html>
