<!-- AI Pitch Modal -->
<div id="ai-pitch-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999999; justify-content:center; align-items:center; font-family:'Inter',sans-serif;">
  <div style="background:#0f172a; border:1px solid rgba(255,255,255,0.1); width:600px; max-width:90%; border-radius:12px; overflow:hidden; box-shadow:0 25px 50px rgba(0,0,0,0.8);">
    <div style="padding:15px 20px; background:rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;">
      <h3 style="color:white; font-size:1rem; margin:0; display:flex; align-items:center; gap:8px;">🤖 OTIS AI Pitch Drafter</h3>
      <button onclick="document.getElementById('ai-pitch-modal').style.display='none'" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <div style="padding:20px;">
      <div style="margin-bottom:15px; display:flex; gap:10px;">
        <select id="ai-lang-select" style="background:rgba(0,0,0,0.3); color:white; border:1px solid rgba(255,255,255,0.2); padding:8px; border-radius:6px; font-size:0.85rem;">
          <option value="fr">French (Quebec / CPEEP Decree)</option>
          <option value="en">English (Pre-Winter Wedge)</option>
        </select>
        <button id="ai-draft-btn" style="background:#3b82f6; color:white; border:none; padding:8px 15px; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.85rem;">Regenerate Pitch</button>
      </div>
      <div id="ai-pitch-output" style="background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.05); border-radius:8px; padding:15px; color:#e2e8f0; font-size:0.9rem; line-height:1.6; min-height:150px; white-space:pre-wrap;">Loading AI Draft...</div>
      <div style="margin-top:15px; display:flex; justify-content:flex-end;">
        <button onclick="copyAIPitch()" style="background:#10b981; color:white; border:none; padding:8px 15px; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.85rem;">📋 Copy to Clipboard</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentAITarget = {};
  
  async function generateAIPitch(name, category, address) {
    currentAITarget = { leadName: name, industry: category, address: address };
    document.getElementById('ai-pitch-modal').style.display = 'flex';
    fetchAIDraft();
  }

  document.getElementById('ai-draft-btn').addEventListener('click', fetchAIDraft);

  async function fetchAIDraft() {
    const output = document.getElementById('ai-pitch-output');
    const lang = document.getElementById('ai-lang-select').value;
    output.innerHTML = '<span style="color:#94a3b8; font-style:italic;">OTIS AI is drafting a compliant outreach pitch...</span>';
    
    try {
      const res = await fetch('/api/draft', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...currentAITarget, language: lang })
      });
      const data = await res.json();
      if (res.ok && data.draft) {
        output.textContent = data.draft;
      } else {
        output.textContent = "Error: " + (data.error || "Missing GEMINI_API_KEY in Vercel settings.");
      }
    } catch (e) {
      output.textContent = "Network Error. Are you running on Vercel?";
    }
  }

  function copyAIPitch() {
    const text = document.getElementById('ai-pitch-output').textContent;
    navigator.clipboard.writeText(text);
    alert('Copied to clipboard!');
  }
</script>
